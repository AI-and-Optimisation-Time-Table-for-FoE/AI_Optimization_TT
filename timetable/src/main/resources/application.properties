spring.application.name=timetable

# Local MySQL Database (foe_timetable_scheduler) with environment variable override
spring.datasource.url=${JDBC_DATABASE_URL:jdbc:mysql://localhost:3306/foe_timetable_scheduler}
spring.datasource.username=${JDBC_DATABASE_USERNAME:root}
spring.datasource.password=${JDBC_DATABASE_PASSWORD:Gimaya@1234}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Bind to the PORT environment variable (which AWS provides as 5000) or default to 5000
server.port=${PORT:5000}

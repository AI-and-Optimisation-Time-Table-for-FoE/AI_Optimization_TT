spring.application.name=timetable

# Default Local SQLite Database with fallback to Cloud MySQL/PostgreSQL
spring.datasource.url=${JDBC_DATABASE_URL:jdbc:sqlite:timetable.db}
spring.datasource.driver-class-name=${JDBC_DATABASE_DRIVER:org.sqlite.JDBC}
spring.datasource.username=${JDBC_DATABASE_USERNAME:}
spring.datasource.password=${JDBC_DATABASE_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=${JDBC_HIBERNATE_DIALECT:org.hibernate.community.dialect.SQLiteDialect}

server.port=8080
